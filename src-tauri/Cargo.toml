[package]
name = "termforge"
version = "0.1.0"
description = "A Tauri-based terminal application"
authors = ["TermForge Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/luoyaosheng/TermForge"
edition = "2021"

[lib]
name = "termforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
anyhow = "1"
nanoid = "0.4"
ssh2 = "0.9"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
gethostname = "0.5"
whoami = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
